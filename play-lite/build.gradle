plugins {
    id 'com.android.application' version '8.10.1' apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    layout.buildDirectory = rootProject.layout.projectDirectory.dir(project.name == 'lite' ? '../build/lite-play' : '../build/cleanlite')
}
