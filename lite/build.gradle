plugins {
    id 'com.android.application'
}

def signingProps = new Properties()
def signingFile = new File(rootProject.projectDir, rootProject.name == 'lite-play' ? '../signing.properties' : 'signing.properties')
if (signingFile.exists()) {
    signingFile.withInputStream { signingProps.load(it) }
}

android {
    namespace 'com.hwserve.workslite'
    compileSdk 36

    defaultConfig {
        applicationId 'com.hwserve.smsforwarder'
        minSdk 23
        targetSdk 36
        versionCode 300066
        versionName '3.5.0.260929-notify-lite-play'
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                def keystorePath = new File(signingProps.getProperty('storeFile'))
                storeFile keystorePath.isAbsolute() ? keystorePath : new File(signingFile.parentFile, signingProps.getProperty('storeFile'))
                storePassword signingProps.getProperty('storePassword')
                keyAlias signingProps.getProperty('keyAlias')
                keyPassword signingProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (!signingFile.exists()) {
                throw new GradleException('Existing release signing is required for an in-place update.')
            }
            signingConfig signingConfigs.release
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = "SmsKR_Notify_Lite_${variant.versionCode}_${variant.name}.apk"
        }
    }
}
