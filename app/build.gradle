//file:noinspection DependencyNotationArgument
import groovy.json.JsonBuilder
import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
    id 'img-optimizer'
    id 'com.yanzhenjie.andserver'
    //AspectJX: https://github.com/wurensen/gradle_plugin_android_aspectjx
    //id "io.github.wurensen.android-aspectjx" version "3.3.2"
}

/**
 * ================================
 * ================================
 */
ext.enableXaop = gradle.startParameter.taskNames.any { name ->
    name.toLowerCase().contains("release")
}
println "[XAOP] enable = ${enableXaop}, tasks = ${gradle.startParameter.taskNames}"

def signingProps = new Properties()
def signingPropsPath = providers.gradleProperty("signingProperties").orNull
    ?: System.getenv("SMSFORWARDER_SIGNING_PROPERTIES")
def signingPropsFile = signingPropsPath ? rootProject.file(signingPropsPath) : rootProject.file("signing.properties")
if (signingPropsFile.exists()) {
    signingProps.load(new FileInputStream(signingPropsFile))
}
def hasReleaseSigning = ["keyAlias", "keyPassword", "storeFile", "storePassword"].every {
    signingProps.getProperty(it)?.trim()
}
def signedReleaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase() ==~ /.*(assemble|bundle|package).*release.*/
}

if (isNeedPackage.toBoolean() && isUseBooster.toBoolean()) {
    apply plugin: 'com.didiglobal.booster'
}

gradle.projectsEvaluated {
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xlint:-removal"
    }
}

android {
    buildToolsVersion build_versions.build_tools
    compileSdkVersion build_versions.target_sdk

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lintOptions {
        // Existing API 19 layouts use framework vector drawables; changing every
        // layout to app:srcCompat is outside this privacy/localization change.
        disable 'VectorDrawableCompat'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }

    def buildDate = new Date().format("yyMMdd", TimeZone.getTimeZone("GMT+08"))
    def buildTime = new Date().format("yyyy-MM-dd HH:mm:ss", TimeZone.getTimeZone("GMT+08"))
    def gitCommitId = getGitCommitId()

    defaultConfig {
        applicationId "com.hwserve.smsforwarder"
        minSdkVersion build_versions.min_sdk
        targetSdkVersion build_versions.target_sdk
        versionCode build_versions.version_code
        resConfigs "ko"
        versionName = "${build_versions.version_name}.${buildDate}-kr-${gitCommitId.take(8)}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "BUILD_TIME", "\"${buildTime}\""
        buildConfigField "String", "GIT_COMMIT_ID", "\"${gitCommitId}\""

        multiDexEnabled true
        //vectorDrawables.useSupportLibrary = true

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [moduleName: project.getName()]
            }
        }

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
                storeFile rootProject.file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            jniDebuggable false
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else if (signedReleaseTaskRequested) {
                throw new GradleException("Release signing is required. Create an ignored signing.properties file or set SMSFORWARDER_SIGNING_PROPERTIES.")
            }

            buildConfigField "boolean", "DISABLE_R8_WARNINGS", "true"
        }
        debug {
            debuggable true
            jniDebuggable true
            applicationIdSuffix '.debug'
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            buildConfigField "boolean", "DISABLE_R8_WARNINGS", "true"
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }
    packagingOptions {
        jniLibs {
            excludes += ["**/libgojni.so"]
            excludes += ["kotlin/**"]
        }
        resources {
            merge 'META-INF/mailcap'
            pickFirst 'META-INF/LICENSE.md'
            pickFirst 'META-INF/NOTICE.md'
            excludes += ['META-INF/DEPENDENCIES.txt', 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt', 'META-INF/NOTICE', 'META-INF/LICENSE', 'META-INF/DEPENDENCIES', 'META-INF/notice.txt', 'META-INF/license.txt', 'META-INF/dependencies.txt', 'META-INF/LGPL2.1']
            excludes += ["META-INF/*.kotlin_module", "META-INF/*.version", "kotlin/**", "DebugProbesKt.bin"]
        }
    }

    android.applicationVariants.configureEach { variant ->
        variant.outputs.each { output ->
            //noinspection GrDeprecatedAPIUsage
            def abiName = output.getFilter(com.android.build.OutputFile.ABI)
            if (abiName == null) abiName = "universal"
            output.outputFileName = "SmsKR_${versionName}_${variant.versionCode}_${abiName}_${variant.name}.apk"

            def assembleTaskName = "assemble${variant.name.capitalize()}"
            tasks.named(assembleTaskName) {
                doLast {
                    def metadataFile = file("${output.outputFile.parent}/output-metadata.json")
                    def metadata = new JsonSlurper().parseText(metadataFile.text)
                    metadata.buildDate = buildDate
                    metadata.buildTime = buildTime
                    metadata.gitCommitId = gitCommitId
                    metadataFile.text = new JsonBuilder(metadata).toPrettyString()
                }
            }
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    lint {
        abortOnError true
    }
    namespace 'cn.ppps.forwarder'

    /**
     */
    if (isNeedClean.toBoolean() && enableXaop) {
        preBuild.dependsOn clean
    }
}

/**
 * ================================
 * ================================
 */
afterEvaluate {
    android.applicationVariants.configureEach { variant ->
        if (variant.buildType.name != "release") {
            tasks.matching {
                it.name.toLowerCase().contains("xaop") || it.name.toLowerCase().contains("aspectj")
            }.configureEach {
                enabled = false
                println "[XAOP] disable task: ${name}"
            }
        }
    }
}

/**
 */
tasks.withType(Test).configureEach {
    systemProperty "xaop.enable", "false"
}

